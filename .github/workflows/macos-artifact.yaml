---
name: macOS Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      profile:
        description: 'Cargo profile (release | smol)'
        required: false
        default: 'release'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: aarch64-apple-darwin
    runs-on: macos-14
    timeout-minutes: 60
    env:
      PROFILE: ${{ github.event.inputs.profile || 'release' }}
      TARGET: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: >- # v4.2.2
          actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Verify tag is on v1_branch
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          git fetch origin v1_branch:refs/remotes/origin/v1_branch
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/v1_branch; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on v1_branch. Refusing to release."
            exit 1
          fi

      - name: Set up Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup target add "$TARGET"
        shell: bash

      - name: Rust cache
        # https://github.com/Swatinem/rust-cache/releases/tag/v2.8.1
        uses: Swatinem/rust-cache@a84bfdc502f07db5a85dd9d7a30f91a931516cc5
        with:
          key: ${{ env.TARGET }}-${{ env.PROFILE }}

      - name: Build nativelink
        run: cargo build --bin nativelink --profile "$PROFILE" --target "$TARGET"

      - name: Stage artifact
        id: stage
        run: |
          set -euo pipefail
          case "$PROFILE" in
            release) out_dir="target/$TARGET/release" ;;
            smol)    out_dir="target/$TARGET/smol" ;;
            *)       out_dir="target/$TARGET/$PROFILE" ;;
          esac
          bin="$out_dir/nativelink"
          test -x "$bin"
          codesign -s - -f "$bin"
          archive="nativelink-$TARGET.tar.gz"
          staging="$(mktemp -d)"
          cp "$bin" "$staging/nativelink"
          tar -czf "$archive" -C "$staging" nativelink
          shasum -a 256 "$archive" > "$archive.sha256"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "checksum=$archive.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        # https://github.com/actions/upload-artifact/releases/tag/v4.4.3
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: nativelink-aarch64-apple-darwin
          path: |
            ${{ steps.stage.outputs.archive }}
            ${{ steps.stage.outputs.checksum }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${{ steps.stage.outputs.archive }}" "${{ steps.stage.outputs.checksum }}" --clobber
          else
            gh release create "$tag" \
              --title "nativelink $tag" \
              --generate-notes \
              "${{ steps.stage.outputs.archive }}" "${{ steps.stage.outputs.checksum }}"
          fi
